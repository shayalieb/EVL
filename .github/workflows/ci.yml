name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      SESSION_SECRET: ci-session-secret-that-is-long-enough
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit backend production dependencies
        run: npm run audit:prod
        working-directory: server

      - name: Lint
        run: npm run lint

      - name: Test backend
        run: npm test
        working-directory: server

      - name: Apply test database migrations
        run: npx prisma migrate deploy
        working-directory: server

      - name: Test backend integration
        run: npm run test:integration
        working-directory: server

      - name: Run bounded capacity regression
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=development PORT=4101 REQUEST_LOG_SAMPLE_RATE=0 node src/index.js > /tmp/evl-capacity-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4101/api/ready >/dev/null; then break; fi
            sleep 1
          done
          LOAD_TEST_BASE_URL=http://127.0.0.1:4101 \
          LOAD_TEST_EMAIL=stripe@example.com \
          LOAD_TEST_PASSWORD=password-123 \
          LOAD_TEST_PROFILE=mixed \
          LOAD_TEST_CONCURRENCY=10 \
          LOAD_TEST_WARMUP_MS=500 \
          LOAD_TEST_DURATION_MS=3000 \
          LOAD_TEST_P95_BUDGET_MS=1000 \
          LOAD_TEST_MAX_ERROR_RATE=0 \
          node scripts/loadTest.js

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Test browser workflows
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

      - name: Enforce frontend bundle budget
        run: npm run check:bundle

      - name: Generate backend client
        run: npm run build
        working-directory: server

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
