name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      SESSION_SECRET: ci-session-secret-that-is-long-enough
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Lint
        run: npm run lint

      - name: Test backend
        run: npm test
        working-directory: server

      - name: Apply test database migrations
        run: npx prisma migrate deploy
        working-directory: server

      - name: Test backend integration
        run: npm run test:integration
        working-directory: server

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Test browser workflows
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

      - name: Generate backend client
        run: npm run build
        working-directory: server

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
